{% extends "base.html" %}
{% block title %}{{ SITENAME }} - Inicio{% endblock %}


{% block content %}
 {% if articles %}
  {% for article in articles[:6] %}
    <article class="post">
      <h2 class="title"><a href="{{ SITEURL }}/{{ article.url}}">{{ article.title }}</a></h2>
      {%include 'meta.html'%}
      <section class="post_content">
        {{ article.summary }}<br />
        <a class="more" href="{{ SITEURL }}/{{ article.url }}">Leer mas...</a>
      </section>
    </article>
  {% endfor %}
 {% endif %}
{% endblock %}
