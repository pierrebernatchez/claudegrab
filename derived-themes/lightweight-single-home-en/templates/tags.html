{% extends "base.html" %}

{% block title %}{{ SITENAME }} - Key Words {% endblock %}

{% block content %}
<h2 class="page_title">List of key words</h2>
<ul id="tag_list">
{% for tag, articles in tags|sort %}
    <li><a href="{{SITEURL}}/{{tag.url}}">{{ tag }}</a></li>
{% endfor %}
</ul>
{% endblock %}
